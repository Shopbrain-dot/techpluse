<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechPulse Admin Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            background: #0b1220;
            color: white;
            padding: 24px 16px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            padding: 0 12px;
            margin-bottom: 35px;
        }

        .logo span {
            color: #60a5fa;
        }

        .admin-label {
            padding: 0 12px;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 9px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #1e293b;
            color: white;
        }

        .logout {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 20px;
            border: 0;
            background: #1e293b;
            color: #cbd5e1;
            padding: 12px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .logout:hover {
            background: #334155;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 30px;
        }

        .topbar p {
            color: #6b7280;
            margin-top: 5px;
            font-size: 14px;
        }

        .admin-name {
            background: white;
            border: 1px solid #e5e7eb;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
        }

        /* STATS */

        .stats {
            display: grid;
