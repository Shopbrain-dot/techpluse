<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading article... | TechPulse</title>

<meta
    name="description"
    id="metaDescription"
    content="TechPulse technology news."
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

header {
    background: #0b1220;
    color: white;
    padding: 18px 20px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    text-decoration: none;
    color: white;
}

.logo span {
    color: #60a5fa;
}

nav a {
    color: #cbd5e1;
    text-decoration: none;
    margin-left: 18px;
    font-size: 14px;
    font-weight: bold;
}

nav a:hover {
    color: white;
}

main {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
}

.article {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    overflow: hidden;
}

.featured-image {
    width: 100%;
    max-height: 520px;
    object-fit: cover;
    display: none;
}

.article-content {
    padding: 35px;
}

.category {
    display: inline-block;
    background: #eff6ff;
    color: #2563eb;
    padding: 6px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 15px;
}

h1 {
    font-size: 42px;
    line-height: 1.15;
    margin: 0 0 15px;
}

.excerpt {
    color: #6b7280;
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 20px;
}

.meta {
    color: #6b7280;
    font-size: 13px;
    padding-bottom: 25px;
    border-bottom: 1px solid #e5e7eb;
    margin-bottom: 25px;
}

.content {
    font-size: 17px;
    line-height: 1.85;
    white-space: pre-wrap;
    word-wrap: break-word;
}

/* SHARE */

.share-box {
    margin-top: 35px;
    padding-top: 25px;
    border-top: 1px solid #e5e7eb;
}

.share-title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 12px;
}

.share-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.share-btn {
    border: 0;
    padding: 11px 15px;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
}

.facebook {
    background: #1877f2;
}

.whatsapp {
    background: #25d366;
}

.x {
    background: #111827;
}

.copy {
    background: #475569;
}

.native-share {
    background: #2563eb;
}

.share-btn:hover {
    opacity: 0.88;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    color: #2563eb;
    text-decoration: none;
    font-weight: 800;
}

.loading,
.error {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 40px;
    text-align: center;
}

.error h2 {
    margin-top: 0;
}

.copy-message {
    display: none;
    margin-top: 10px;
    color: #166534;
    font-size: 13px;
    font-weight: bold;
}

@media (max-width: 700px) {

    main {
        margin: 20px auto;
    }

    .article-content {
        padding: 22px;
    }

    h1 {
        font-size: 30px;
    }

    .excerpt {
        font-size: 16px;
    }

    .content {
        font-size: 16px;
    }

    .header-inner {
        flex-direction: column;
        align-items: flex-start;
    }

    nav a {
        margin-left: 0;
        margin-right: 15px;
    }

    .share-btn {
        width: 100%;
        text-align: center;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <a href="index.html" class="logo">
            Tech<span>Pulse</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="articles.html">Articles</a>
        </nav>

    </div>
</header>

<main>

    <a href="index.html" class="back">
        ← Back to TechPulse
    </a>

    <div id="loading" class="loading">
        Loading article...
    </div>

    <article
        id="article"
        class="article"
        style="display:none;"
    >

        <img
            id="featuredImage"
            class="featured-image"
            alt=""
        >

        <div class="article-content">

            <div
                id="category"
                class="category"
                style="display:none;"
            ></div>

            <h1 id="title"></h1>

            <div
                id="excerpt"
                class="excerpt"
            ></div>

            <div
                id="meta"
                class="meta"
            ></div>

            <div
                id="content"
                class="content"
            ></div>
