<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Article | TechPulse Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: #0b1220;
            color: white;
            padding: 24px 16px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            padding: 0 12px;
            margin-bottom: 35px;
        }

        .logo span {
            color: #60a5fa;
        }

        .admin-label {
            padding: 0 12px;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .nav-item {
            display: block;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 9px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #1e293b;
            color: white;
        }

        .logout {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 20px;
            border: 0;
            background: #1e293b;
            color: #cbd5e1;
            padding: 12px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
        }

        .topbar {
            margin-bottom: 25px;
        }

        .topbar h1 {
            font-size: 30px;
        }

        .topbar p {
            color: #6b7280;
            margin-top: 6px;
        }

        .editor {
            max-width: 1000px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 25px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font: inherit;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.7;
        }

        .excerpt {
            min-height: 100px;
        }

        .slug-help {
            margin-top: 6px;
            color: #6b7280;
            font-size: 12px;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        button {
            border: 0;
            padding: 13px 18px;
            border-radius: 9px;
            font-weight: 800;
            cursor: pointer;
        }

        .draft-button {
            background: #e5e7eb;
            color: #111827;
        }

        .publish-button {
            background: #2563eb;
            color: white;
        }

        .cancel-button {
            background: white;
            border: 1px solid #d1d5db;
            color: #374151;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 9px;
            display: none;
            font-size: 14px;
        }

        @media (max-width: 700px) {

            .layout {
                display: block;
            }

            .sidebar {
                position: relative;
                width: 100%;
            }

            .logout {
                position: static;
                width: 100%;
                margin-top: 20px;
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }

            .two-columns {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            Tech<span>Pulse</span>
        </div>

        <div class="admin-label">
            Administration
        </div>

        <a href="dashboard.html" class="nav-item">
            📊 Dashboard
        </a>

        <a href="articles.html" class="nav-item active">
            📰 Articles
        </a>

        <a href="#" class="nav-item">
            🏷️ Categories
        </a>

        <a href="#" class="nav-item">
            ✍️ Authors
        </a>

        <a href="#" class="nav-item">
            📧 Subscribers
        </a>

        <a href="#" class="nav-item">
            ⚙️ Settings
        </a>

        <button class="logout" id="logoutButton">
            🚪 Log out
        </button>

    </aside>


    <main class="main">

        <div class="topbar">

            <h1 id="pageTitle">
                Create Article
            </h1>

            <p>
                Write, save and publish TechPulse stories.
            </p>

        </div>


        <div id="message"></div>


        <form class="editor" id="articleForm">

            <div class="field">

                <label for="title">
                    Article Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter your article headline"
                    required
                >

            </div>


            <div class="field">

                <label for="slug">
                    URL Slug
                </label>

                <input
                    type="text"
                    id="slug"
                    placeholder="article-url-slug"
                    required
                >

                <div class="slug-help">
                    Example: openai-launches-new-ai-model
                </div>

            </div>


            <div class="field">

                <label for="excerpt">
                    Short Description
                </label>

                <textarea
                    id="excerpt"
                    class="excerpt"
                    placeholder="Write a short description for the article..."
                ></textarea>

            </div>


            <div class="field">

                <label for="content">
                    Article Content
                </label>

                <textarea
                    id="content"
                    placeholder="Write your full article here..."
                    required
                ></textarea>

            </div>


            <div class="field">

                <label for="featuredImage">
                    Featured Image URL
                </label>

                <input
                    type="url"
                    id="featuredImage"
                    placeholder="https://example.com/image.jpg"
                >

            </div>


            <div class="two-columns">

                <div class="field">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Loading categories...
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label for="author">
                        Author
                    </label>

                    <select id="author">

                        <option value="">
                            No author
                        </option>

                    </select>

                </div>

            </div>


            <div class="actions">

                <button
                    type="button"
                    class="draft-button"
                    id="draftButton"
                >
                    💾 Save Draft
                </button>

                <button
                    type="button"
                    class="publish-button"
                    id="publishButton"
                >
                    📤 Publish Article
                </button>

                <button
                    type="button"
                    class="cancel-button"
                    onclick="window.location.href='articles.html'"
                >
                    Cancel
                </button>

            </div>

        </form>

    </main>

</div>


<script>

    let currentUser = null;
    let editingArticleId = null;


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(text, type) {

        const message =
            document.getElementById("message");

        message.textContent = text;
        message.style.display = "block";

        if (type === "error") {
            message.style.background = "#fef2f2";
            message.style.color = "#dc2626";
        }

        if (type === "success") {
            message.style.background = "#f0fdf4";
            message.style.color = "#166534";
        }

        if (type === "info") {
            message.style.background = "#eff6ff";
            message.style.color = "#1d4ed8";
        }
    }


    /* =========================
       PROTECT PAGE
    ========================= */

    async function protectPage() {

        const {
            data: { user },
            error
        } = await supabaseClient.auth.getUser();

        if (error || !user) {

            window.location.href = "index.html";

            return false;
        }


        const { data: admin, error: adminError } =
            await supabaseClient
                .from("admin_profiles")
                .select("is_admin")
                .eq("id", user.id)
                .single();


        if (
            adminError ||
            !admin ||
            admin.is_admin !== true
        ) {

            await supabaseClient.auth.signOut();

            window.location.href = "index.html";

            return false;
        }


        currentUser = user;

        return true;
    }


    /* =========================
       LOAD CATEGORIES
    ========================= */

    async function loadCategories() {

        const select =
            document.getElementById("category");


        const { data, error } =
            await supabaseClient
                .from("categories")
                .select("id, name")
                .order("name");


        if (error) {

            showMessage(
                "Unable to load categories: " +
                error.message,
                "error"
            );

            return;
        }


        select.innerHTML =
            '<option value="">Select category</option>';


        data.forEach(category => {

            const option =
                document.createElement("option");

            option.value = category.id;
            option.textContent = category.name;

            select.appendChild(option);

        });

    }


    /* =========================
       LOAD AUTHORS
    ========================= */

    async function loadAuthors() {

        const select =
            document.getElementById("author");


        const { data, error } =
            await supabaseClient
                .from("authors")
                .select("id, name")
                .order("name");


        if (error) {

            console.error(error);

            return;
        }


        select.innerHTML =
            '<option value="">No author</option>';


        data.forEach(author => {

            const option =
                document.createElement("option");

            option.value = author.id;
            option.textContent = author.name;

            select.appendChild(option);

        });

    }


    /* =========================
       SLUG GENERATOR
    ========================= */

    const titleInput =
        document.getElementById("title");

    const slugInput =
        document.getElementById("slug");


    titleInput.addEventListener("input", function () {

        if (editingArticleId) return;


        const slug =
            titleInput.value
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9\s-]/g, "")
                .replace(/\s+/g, "-")
                .replace(/-+/g, "-");


        slugInput.value = slug;

    });


    /* =========================
       SAVE ARTICLE
    ========================= */

    async function saveArticle(status) {

        const title =
            document.getElementById("title")
                .value.trim();

        const slug =
            document.getElementById("slug")
                .value.trim();

        const excerpt =
            document.getElementById("excerpt")
                .value.trim();

        const content =
            document.getElementById("content")
                .value.trim();

        const featuredImage =
            document.getElementById("featuredImage")
                .value.trim();

        const categoryId =
            document.getElementById("category")
                .value || null;

        const authorId =
            document.getElementById("author")
                .value || null;


        if (!title || !slug || !content) {

            showMessage(
                "Please enter a title, slug and article content.",
                "error"
            );

            return;
        }


        if (!currentUser) {

            showMessage(
                "Your session has expired. Please log in again.",
                "error"
            );

            return;
        }


        const article = {

            title: title,

            slug: slug,

            excerpt: excerpt || null,

            content: content,

            featured_image:
                featuredImage || null,

            category_id:
                categoryId,

            author_id:
                authorId,

            status:
                status,

            published_at:
                status === "published"
                    ? new Date().toISOString()
                    : null

        };


        const draftButton =
            document.getElementById("draftButton");

        const publishButton =
            document.getElementById("publishButton");


        draftButton.disabled = true;
        publishButton.disabled = true;


        showMessage(
            status === "published"
                ? "Publishing article..."
                : "Saving draft...",
            "info"
        );


        try {

            let result;


            if (editingArticleId) {

                result =
                    await supabaseClient
                        .from("articles")
                        .update(article)
                        .eq("id", editingArticleId)
                        .select()
                        .single();

            } else {

                result =
                    await supabaseClient
                        .from("articles")
                        .insert(article)
                        .select()
                        .single();

            }


            if (result.error) {
                throw result.error;
            }


            showMessage(
                status === "published"
                    ? "Article published successfully!"
                    : "Article saved as draft!",
                "success"
            );


            setTimeout(function () {

                window.location.href =
                    "articles.html";

            }, 1000);


        } catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Unable to save article.",
                "error"
            );

            draftButton.disabled = false;
            publishButton.disabled = false;

        }

    }


    /* =========================
       BUTTONS
    ========================= */

    document
        .getElementById("draftButton")
        .addEventListener("click", function () {

            saveArticle("draft");

        });


    document
        .getElementById("publishButton")
        .addEventListener("click", function () {

            saveArticle("published");

        });


    /* =========================
       LOAD EXISTING ARTICLE
    ========================= */

    async function loadExistingArticle() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        editingArticleId =
            params.get("id");


        if (!editingArticleId) return;


        document.getElementById("pageTitle")
            .textContent = "Edit Article";


        const { data, error } =
            await supabaseClient
                .from("articles")
                .select("*")
                .eq("id", editingArticleId)
                .single();


        if (error) {

            showMessage(
                "Unable to load article: " +
                error.message,
                "error"
            );

            return;
        }


        document.getElementById("title")
            .value = data.title || "";

        document.getElementById("slug")
            .value = data.slug || "";

        document.getElementById("excerpt")
            .value = data.excerpt || "";

        document.getElementById("content")
            .value = data.content || "";

        document.getElementById("featuredImage")
            .value = data.featured_image || "";

        document.getElementById("category")
            .value = data.category_id || "";

        document.getElementById("author")
            .value = data.author_id || "";

    }


    /* =========================
       LOGOUT
    ========================= */

    document
        .getElementById("logoutButton")
        .addEventListener("click", async function () {

            await supabaseClient.auth.signOut();

            window.location.href = "index.html";

        });


    /* =========================
       START
    ========================= */

    async function start() {

        const allowed =
            await protectPage();

        if (!allowed) return;

        await loadCategories();

        await loadAuthors();

        await loadExistingArticle();

    }


    start();

</script>

</body>
</html>
