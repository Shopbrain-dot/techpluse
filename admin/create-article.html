/* =====================================================
   GET ARTICLE SLUG
===================================================== */

const urlParams =
    new URLSearchParams(window.location.search);

const slug =
    (urlParams.get("slug") || "").trim();


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const errorMessage =
    document.getElementById("errorMessage");

const articleCard =
    document.getElementById("articleCard");


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   CHECK HTML CONTENT
===================================================== */

function containsHtml(value){

    return /<([a-z][\s\S]*?)>/i.test(
        String(value || "")
    );

}


/* =====================================================
   FORMAT ARTICLE
===================================================== */

function formatArticleContent(content){

    if(!content){

        return `
            <p>No article content is available.</p>
        `;

    }

    const value =
        String(content);


    /*
       If the database contains HTML,
       preserve the article formatting.
    */

    if(containsHtml(value)){

        const parser =
            new DOMParser();

        const doc =
            parser.parseFromString(
                value,
                "text/html"
            );


        /*
           Remove dangerous elements.
        */

        doc
            .querySelectorAll(
                "script,iframe,object,embed,form,style"
            )
            .forEach(
                element =>
                    element.remove()
            );


        /*
           Remove dangerous attributes.
        */

        doc
            .querySelectorAll("*")
            .forEach(
                element => {

                    [...element.attributes]
                        .forEach(
                            attribute => {

                                const name =
                                    attribute.name
                                        .toLowerCase();

                                const value =
                                    attribute.value
                                        .trim()
                                        .toLowerCase();


                                if(
                                    name.startsWith("on")
                                ){

                                    element.removeAttribute(
                                        attribute.name
                                    );

                                }


                                if(
                                    (
                                        name === "href" ||
                                        name === "src"
                                    ) &&
                                    value.startsWith(
                                        "javascript:"
                                    )
                                ){

                                    element.removeAttribute(
                                        attribute.name
                                    );

                                }

                            }
                        );

                }
            );


        return doc.body.innerHTML;

    }


    /*
       If content is normal text,
       preserve paragraphs.
    */

    return value
        .split(/\r?\n/)
        .map(
            paragraph => {

                const text =
                    paragraph.trim();

                if(!text){
                    return "";
                }

                return `
                    <p>
                        ${escapeHtml(text)}
                    </p>
                `;

            }
        )
        .join("");

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message){

    loading.style.display =
        "none";

    articleCard.style.display =
        "none";

    errorBox.style.display =
        "block";

    errorMessage.textContent =
        message ||
        "We couldn't find this article.";

}


/* =====================================================
   LOAD ARTICLE
===================================================== */

async function loadArticle(){

    /*
       No slug means somebody opened
       article.html directly.
    */

    if(!slug){

        showError(
            "No article was selected. Please open the article using its share link."
        );

        return;

    }


    /*
       Make sure Supabase exists.
    */

    if(
        typeof supabaseClient ===
        "undefined"
    ){

        showError(
            "Supabase is not configured. Check ./js/supabase.js."
        );

        return;

    }


    try{

        console.log(
            "TechPulse article slug:",
            slug
        );


        const {
            data: article,
            error
        } =
        await supabaseClient
            .from("articles")
            .select(`
                id,
                title,
                slug,
                excerpt,
                content,
                featured_image,
                status,
                views,
                created_at,
                categories (
                    name
                )
            `)
            .eq(
                "slug",
                slug
            )
            .eq(
                "status",
                "published"
            )
            .maybeSingle();


        if(error){

            console.error(
                "Supabase article error:",
                error
            );

            showError(
                "Database error: " +
                error.message
            );

            return;

        }


        if(!article){

            showError(
                "This article does not exist or has not been published."
            );

            return;

        }


        displayArticle(article);

        increaseViews(article);

    }catch(error){

        console.error(
            "Article loading error:",
            error
        );

        showError(
            error.message ||
            "Unable to load this article."
        );

    }

}


/* =====================================================
   DISPLAY ARTICLE
===================================================== */

function displayArticle(article){

    document.title =
        (
            article.title ||
            "TechPulse"
        ) +
        " | TechPulse";


    document
        .getElementById("metaDescription")
        .setAttribute(
            "content",
            article.excerpt ||
            "Read the latest technology news on TechPulse."
        );


    document
        .getElementById("articleTitle")
        .textContent =
        article.title ||
        "Untitled Article";


    document
        .getElementById("articleCategory")
        .textContent =
        article.categories?.name ||
        "Technology";


    let dateText = "";


    if(article.created_at){

        const date =
            new Date(
                article.created_at
            );


        if(!Number.isNaN(date.getTime())){

            dateText =
                date.toLocaleDateString(
                    "en-US",
                    {
                        year:"numeric",
                        month:"long",
                        day:"numeric"
                    }
                );

        }

    }


    document
        .getElementById("articleMeta")
        .textContent =
        dateText
        ? "TechPulse • " + dateText
        : "TechPulse";


    /*
       FEATURED IMAGE
    */

    const image =
        document.getElementById(
            "featuredImage"
        );


    if(article.featured_image){

        image.src =
            article.featured_image;

        image.alt =
            article.title ||
            "TechPulse article";

        image.style.display =
            "block";


        image.onerror =
            function(){

                this.style.display =
                    "none";

            };

    }else{

        image.style.display =
            "none";

    }


    /*
       EXCERPT
    */

    const excerpt =
        document.getElementById(
            "articleExcerpt"
        );


    if(article.excerpt){

        excerpt.textContent =
            article.excerpt;

        excerpt.style.display =
            "block";

    }else{

        excerpt.style.display =
            "none";

    }


    /*
       FULL ARTICLE
    */

    const body =
        document.getElementById(
            "articleBody"
        );


    body.innerHTML =
        formatArticleContent(
            article.content
        );


    loading.style.display =
        "none";

    errorBox.style.display =
        "none";

    articleCard.style.display =
        "block";

}


/* =====================================================
   INCREASE VIEWS
===================================================== */

async function increaseViews(article){

    try{

        const currentViews =
            Number(
                article.views || 0
            );


        await supabaseClient
            .from("articles")
            .update({
                views:
                    currentViews + 1
            })
            .eq(
                "id",
                article.id
            );

    }catch(error){

        console.warn(
            "Could not update views:",
            error
        );

    }

}


/* =====================================================
   GET CURRENT URL
===================================================== */

function getCurrentArticleUrl(){

    return window.location.href;

}

===================================================== */
