<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribers — TechPulse Admin</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    margin: 0;
    padding: 24px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #9aa0a6; font-size: 14px; margin-bottom: 24px; }
  nav { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
  nav a {
    color: #9aa0a6; text-decoration: none; font-size: 14px;
    padding: 6px 10px; border-radius: 6px;
  }
  nav a.active, nav a:hover { color: #fff; background: #1c1f26; }
  .toolbar {
    display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap;
  }
  .toolbar input[type="text"] {
    flex: 1; min-width: 200px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #2a2e37; background: #1a1d24; color: #e6e6e6; font-size: 14px;
  }
  button {
    padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600;
  }
  .btn-primary { background: #4f7cff; color: #fff; }
  .btn-primary:hover { background: #3d68eb; }
  .btn-danger { background: #e5484d; color: #fff; padding: 6px 12px; font-size: 13px; }
  .btn-danger:hover { background: #cc3f44; }
  .count-badge {
    display: inline-block; background: #1c1f26; border: 1px solid #2a2e37;
    padding: 10px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px;
  }
  .count-badge strong { color: #4f7cff; font-size: 18px; }
  table { width: 100%; border-collapse: collapse; background: #14161c; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #22252c; }
  th { background: #1a1d24; color: #9aa0a6; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  .empty, .loading, .error { padding: 30px; text-align: center; color: #9aa0a6; }
  .error { color: #ff8080; }
  #accessGate { max-width: 420px; margin: 80px auto; text-align: center; }
  #accessGate p { color: #9aa0a6; }
</style>
</head>
<body>

<div class="wrap" id="app" style="display:none;">
  <h1>Subscribers</h1>
  <div class="sub">TechPulse newsletter subscribers</div>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="articles.html">Articles</a>
    <a href="subscribers.html" class="active">Subscribers</a>
    <a href="settings.html">Settings</a>
  </nav>

  <div class="count-badge">Total subscribers: <strong id="totalCount">—</strong></div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search by email…">
    <button class="btn-primary" id="refreshBtn">Refresh</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Subscribed on</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="3" class="loading">Loading…</td></tr>
    </tbody>
  </table>
</div>

<div id="accessGate" style="display:none;">
  <h2 id="gateTitle">Checking access…</h2>
  <p id="gateMessage">Please wait.</p>
</div>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const appEl = document.getElementById('app');
  const gateEl = document.getElementById('accessGate');
  const gateTitle = document.getElementById('gateTitle');
  const gateMessage = document.getElementById('gateMessage');
  const tableBody = document.getElementById('tableBody');
  const totalCount = document.getElementById('totalCount');
  const searchInput = document.getElementById('searchInput');
  const refreshBtn = document.getElementById('refreshBtn');

  let allSubscribers = [];

  function showGate(title, message) {
    appEl.style.display = 'none';
    gateEl.style.display = 'block';
    gateTitle.textContent = title;
    gateMessage.textContent = message;
  }

  function showApp() {
    gateEl.style.display = 'none';
    appEl.style.display = 'block';
  }

  // --- Admin check using admin_profiles + is_admin -------------------------
  async function checkAdmin() {
    const { data: { session }, error: sessionError } = await supabase.auth.getSession();

    if (sessionError || !session) {
      showGate('Sign in required', 'Redirecting to login…');
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
      return false;
    }

    const { data: profile, error: profileError } = await supabase
      .from('admin_profiles')
      .select('is_admin')
      .eq('id', session.user.id)
      .single();

    if (profileError || !profile || profile.is_admin !== true) {
      showGate('Access denied', 'This page is restricted to admins.');
      return false;
    }

    return true;
  }

  // --- Data loading ---------------------------------------------------------
  async function loadSubscribers() {
    tableBody.innerHTML = '<tr><td colspan="3" class="loading">Loading…</td></tr>';

    const { data, error } = await supabase
      .from('subscribers')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      tableBody.innerHTML =
        `<tr><td colspan="3" class="error">Failed to load subscribers: ${escapeHtml(error.message)}</td></tr>`;
      totalCount.textContent = '—';
      return;
    }

    allSubscribers = data || [];
    totalCount.textContent = allSubscribers.length;
    renderTable(allSubscribers);
  }

  function renderTable(rows) {
    if (!rows.length) {
      tableBody.innerHTML = '<tr><td colspan="3" class="empty">No subscribers found.</td></tr>';
      return;
    }

    tableBody.innerHTML = rows.map(row => {
      const email = row.emails ?? '(no email)';
      const date = row.created_at ? new Date(row.created_at).toLocaleString() : '—';
      return `
        <tr data-id="${row.id}">
          <td>${escapeHtml(email)}</td>
          <td>${escapeHtml(date)}</td>
          <td><button class="btn-danger" data-delete="${row.id}">Delete</button></td>
        </tr>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // --- Search ----------------------------------------------------------------
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) {
      renderTable(allSubscribers);
      return;
    }
    const filtered = allSubscribers.filter(row =>
      (row.emails ?? '').toLowerCase().includes(q)
    );
    renderTable(filtered);
  });

  // --- Refresh -----------------------------------------------------------------
  refreshBtn.addEventListener('click', loadSubscribers);

  // --- Delete (event delegation) -------------------------------------------
  tableBody.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-delete]');
    if (!btn) return;

    const id = btn.getAttribute('data-delete');
    const confirmDelete = confirm('Delete this subscriber? This cannot be undone.');
    if (!confirmDelete) return;

    btn.disabled = true;
    btn.textContent = 'Deleting…';

    const { error } = await supabase
      .from('subscribers')
      .delete()
      .eq('id', id);

    if (error) {
      alert('Delete failed: ' + error.message);
      btn.disabled = false;
      btn.textContent = 'Delete';
      return;
    }

    allSubscribers = allSubscribers.filter(row => String(row.id) !== String(id));
    totalCount.textContent = allSubscribers.length;
    renderTable(allSubscribers);
  });

  // --- Boot ------------------------------------------------------------------
  (async function init() {
    showGate('Checking access…', 'Please wait.');
    const isAdmin = await checkAdmin();
    if (!isAdmin) return;
    showApp();
    await loadSubscribers();
  })();
</script>
</body>
</html>
