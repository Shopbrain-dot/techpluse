<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subscribers | TechPulse</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            background: #0b1220;
            color: white;
            padding: 25px 16px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            padding: 0 12px;
            margin-bottom: 35px;
        }

        .logo span {
            color: #60a5fa;
        }

        .section-title {
            color: #94a3b8;
            font-size: 11px;
            font-weight: bold;
            padding: 0 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .nav {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .nav:hover,
        .nav.active {
            background: #1e293b;
            color: white;
        }

        .logout {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #1e293b;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            color: #6b7280;
            margin: 7px 0 0;
        }

        .total-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px 22px;
            min-width: 150px;
        }

        .total-label {
            color: #6b7280;
            font-size: 12px;
            font-weight: bold;
        }

        .total-number {
            font-size: 28px;
            font-weight: 900;
            margin-top: 5px;
        }

        /* MESSAGE */

        #message {
            display: none;
            margin-bottom: 15px;
            padding: 13px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        /* CONTENT */

        .panel {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search {
            width: 100%;
            max-width: 400px;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .search:focus {
            border-color: #2563eb;
        }

        .refresh {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .refresh:hover {
            opacity: 0.9;
        }

        /* TABLE */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th {
            text-align: left;
            padding: 14px;
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            color: #475569;
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            padding: 15px 14px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .email {
            font-weight: bold;
        }

        .date {
            color: #6b7280;
        }

        .delete-btn {
            border: 0;
            border-radius: 7px;
            padding: 8px 12px;
            background: #fee2e2;
            color: #991b1b;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #6b7280;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .layout {
                display: block;
            }

            .sidebar {
                position: relative;
                width: auto;
            }

            .logout {
                position: static;
                width: 100%;
                margin-top: 20px;
            }

            .main {
                margin-left: 0;
                width: auto;
                padding: 20px;
            }

            .header {
                display: block;
            }

            .total-card {
                margin-top: 20px;
            }

            .toolbar {
                display: block;
            }

            .search {
                max-width: none;
                margin-bottom: 10px;
            }

            .refresh {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            Tech<span>Pulse</span>
        </div>

        <div class="section-title">
            Administration
        </div>

        <a href="dashboard.html" class="nav">
            📊 Dashboard
        </a>

        <a href="articles.html" class="nav">
            📰 Articles
        </a>

        <a href="#" class="nav">
            🏷️ Categories
        </a>

        <a href="#" class="nav">
            ✍️ Authors
        </a>

        <a href="subscribers.html" class="nav active">
            📧 Subscribers
        </a>

        <a href="settings.html" class="nav">
            ⚙️ Settings
        </a>

        <button class="logout" id="logout">
            🚪 Log out
        </button>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="header">

            <div>

                <h1>
                    Subscribers
                </h1>

                <p>
                    Manage people subscribed to TechPulse.
                </p>

            </div>

            <div class="total-card">

                <div class="total-label">
                    TOTAL SUBSCRIBERS
                </div>

                <div
                    class="total-number"
                    id="totalSubscribers">
                    0
                </div>

            </div>

        </div>


        <div id="message"></div>


        <div class="panel">

            <div class="toolbar">

                <input
                    type="search"
                    id="search"
                    class="search"
                    placeholder="Search subscribers by email..."
                >

                <button
                    class="refresh"
                    id="refresh"
                    type="button">
                    🔄 Refresh
                </button>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Email
                            </th>

                            <th>
                                Subscribed
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>

                    <tbody id="subscriberList">

                        <tr>

                            <td
                                colspan="3"
                                class="loading">
                                Loading subscribers...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script>

/* =====================================================
   GLOBAL
===================================================== */

let subscribers = [];


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin() {

    try {

        const result =
            await supabaseClient.auth.getUser();

        if (result.error) {
            console.error(result.error);
            return false;
        }

        const user =
            result.data.user;

        if (!user) {

            location.href = "index.html";

            return false;
        }


        const admin =
            await supabaseClient
                .from("admin_profiles")
                .select("is_admin")
                .eq("id", user.id)
                .single();


        if (
            admin.error ||
            !admin.data ||
            admin.data.is_admin !== true
        ) {

            await supabaseClient.auth.signOut();

            location.href = "index.html";

            return false;
        }


        return true;

    } catch (error) {

        console.error(error);

        return false;

    }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, type) {

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.style.display = "block";


    if (type === "success") {

        box.style.background = "#dcfce7";
        box.style.color = "#166534";

    } else {

        box.style.background = "#fee2e2";
        box.style.color = "#991b1b";

    }


    setTimeout(() => {

        box.style.display = "none";

    }, 4000);

}


/* =====================================================
   LOAD SUBSCRIBERS
===================================================== */

async function loadSubscribers() {

    const list =
        document.getElementById("subscriberList");


    list.innerHTML = `
        <tr>
            <td colspan="3" class="loading">
                Loading subscribers...
            </td>
        </tr>
    `;


    try {

        /*
         IMPORTANT:
         Your actual table is:

         public.subscribers

         and the email column is:

         emails
        */

        const result =
            await supabaseClient
                .from("subscribers")
                .select("id,emails,created_at")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (result.error) {

            console.error(result.error);

            list.innerHTML = `
                <tr>
                    <td colspan="3" class="empty">
                        ${escapeHtml(result.error.message)}
                    </td>
                </tr>
            `;

            document.getElementById(
                "totalSubscribers"
            ).textContent = "0";

            return;
        }


        subscribers =
            result.data || [];


        document.getElementById(
            "totalSubscribers"
        ).textContent =
            subscribers.length;


        renderSubscribers();

    } catch (error) {

        console.error(error);

        list.innerHTML = `
            <tr>
                <td colspan="3" class="empty">
                    Could not load subscribers.
                </td>
            </tr>
        `;

    }

}


/* =====================================================
   RENDER SUBSCRIBERS
===================================================== */

function renderSubscribers() {

    const list =
        document.getElementById(
            "subscriberList"
        );


    const search =
        document.getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        subscribers.filter(subscriber => {

            const email =
                String(
                    subscriber.emails || ""
                ).toLowerCase();

            return email.includes(search);

        });


    if (filtered.length === 0) {

        list.innerHTML = `
            <tr>
                <td colspan="3" class="empty">
                    ${
                        search
                            ? "No subscribers match your search."
                            : "No subscribers yet."
                    }
                </td>
            </tr>
        `;

        return;
    }


    list.innerHTML =
        filtered.map(subscriber => {

            const id =
                escapeHtml(
                    subscriber.id
                );

            const email =
                escapeHtml(
                    subscriber.emails
                );

            return `
                <tr>

                    <td class="email">
                        ${email}
                    </td>

                    <td class="date">
                        ${formatDate(
                            subscriber.created_at
                        )}
                    </td>

                    <td>

                        <button
                            class="delete-btn"
                            type="button"
                            onclick="deleteSubscriber('${id}')">
                            Delete
                        </button>

                    </td>

                </tr>
            `;

        }).join("");

}


/* =====================================================
   DELETE SUBSCRIBER
===================================================== */

async function deleteSubscriber(id) {

    const subscriber =
        subscribers.find(
            item =>
                String(item.id) === String(id)
        );


    if (!subscriber) {

        showMessage(
            "Subscriber not found.",
            "error"
        );

        return;
    }


    const confirmed =
        confirm(
            "Delete " +
            subscriber.emails +
            " from your subscribers?"
        );


    if (!confirmed) return;


    try {

        const result =
            await supabaseClient
                .from("subscribers")
                .delete()
                .eq("id", id);


        if (result.error) {

            console.error(result.error);

            showMessage(
                "Could not delete subscriber: " +
                result.error.message,
                "error"
            );

            return;
        }


        showMessage(
            "Subscriber deleted successfully.",
            "success"
        );


        await loadSubscribers();

    } catch (error) {

        console.error(error);

        showMessage(
            "Something went wrong while deleting.",
            "error"
        );

    }

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date) {

    if (!date) {
        return "Unknown";
    }


    try {

        return new Date(date)
            .toLocaleDateString(
                "en-US",
                {
                    year: "numeric",
                    month: "short",
                    day: "numeric"
                }
            );

    } catch {

        return "Unknown";

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderSubscribers
    );


/* =====================================================
   REFRESH
===================================================== */

document
    .getElementById("refresh")
    .addEventListener(
        "click",
        loadSubscribers
    );


/* =====================================================
   LOGOUT
===================================================== */

document
    .getElementById("logout")
    .addEventListener(
        "click",
        async function () {

            await supabaseClient
                .auth
                .signOut();

            location.href = "index.html";

        }
    );


/* =====================================================
   START
===================================================== */

async function start() {

    const allowed =
        await checkAdmin();

    if (!allowed) return;

    await loadSubscribers();

}


start();

</script>

</body>
</html>
