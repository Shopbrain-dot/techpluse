<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Subscribers — TechPulse Admin</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#111827;
}

.layout{
    min-height:100vh;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:250px;
    background:#0b1220;
    color:white;
    padding:25px 16px;
    position:fixed;
    top:0;
    left:0;
    bottom:0;
}

.logo{
    font-size:25px;
    font-weight:900;
    padding:0 12px;
    margin-bottom:35px;
}

.logo span{
    color:#60a5fa;
}

.section-title{
    color:#94a3b8;
    font-size:11px;
    font-weight:bold;
    padding:0 12px;
    margin-bottom:10px;
    text-transform:uppercase;
}

.nav{
    display:block;
    color:#cbd5e1;
    text-decoration:none;
    padding:12px;
    margin-bottom:5px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
}

.nav:hover,
.nav.active{
    background:#1e293b;
    color:white;
}

.logout{
    position:absolute;
    bottom:20px;
    left:16px;
    right:16px;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#1e293b;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

/* MAIN */

.main{
    margin-left:250px;
    width:calc(100% - 250px);
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    color:#6b7280;
    margin:7px 0 0;
}

.total-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:16px 22px;
    min-width:160px;
}

.total-label{
    color:#6b7280;
    font-size:12px;
    font-weight:bold;
}

.total-number{
    font-size:28px;
    font-weight:900;
    margin-top:5px;
}

/* MESSAGE */

#message{
    display:none;
    margin-bottom:15px;
    padding:13px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
}

/* PANEL */

.panel{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:22px;
}

.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.search{
    width:100%;
    max-width:450px;
    padding:12px 14px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:14px;
    outline:none;
}

.search:focus{
    border-color:#2563eb;
}

.refresh{
    padding:12px 18px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.refresh:hover{
    background:#1d4ed8;
}

/* TABLE */

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:600px;
}

th{
    text-align:left;
    padding:14px;
    background:#f8fafc;
    border-bottom:1px solid #e5e7eb;
    color:#475569;
    font-size:12px;
    text-transform:uppercase;
}

td{
    padding:15px 14px;
    border-bottom:1px solid #e5e7eb;
    font-size:14px;
}

tr:last-child td{
    border-bottom:0;
}

.email{
    font-weight:bold;
}

.date{
    color:#6b7280;
}

.delete-btn{
    border:0;
    border-radius:7px;
    padding:8px 12px;
    background:#fee2e2;
    color:#991b1b;
    font-weight:bold;
    cursor:pointer;
}

.delete-btn:hover{
    background:#fecaca;
}

.delete-btn:disabled{
    opacity:.6;
    cursor:wait;
}

.empty,
.loading,
.error{
    text-align:center;
    padding:50px 20px;
    color:#6b7280;
}

.error{
    color:#991b1b;
}

/* ACCESS */

#accessGate{
    display:none;
    max-width:500px;
    margin:100px auto;
    text-align:center;
    padding:30px;
}

#accessGate h2{
    margin-bottom:10px;
}

#accessGate p{
    color:#6b7280;
}

/* MOBILE */

@media(max-width:700px){

    .layout{
        display:block;
    }

    .sidebar{
        position:relative;
        width:auto;
    }

    .logout{
        position:static;
        width:100%;
        margin-top:20px;
    }

    .main{
        margin-left:0;
        width:auto;
        padding:20px;
    }

    .header{
        display:block;
    }

    .total-card{
        margin-top:20px;
    }

    .toolbar{
        display:block;
    }

    .search{
        max-width:none;
        margin-bottom:10px;
    }

    .refresh{
        width:100%;
    }
}
</style>
</head>

<body>

<div id="accessGate">

    <h2 id="gateTitle">
        Checking access...
    </h2>

    <p id="gateMessage">
        Please wait.
    </p>

</div>


<div class="layout" id="app" style="display:none;">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            Tech<span>Pulse</span>
        </div>

        <div class="section-title">
            Administration
        </div>

        <a href="dashboard.html" class="nav">
            📊 Dashboard
        </a>

        <a href="articles.html" class="nav">
            📰 Articles
        </a>

        <a href="#" class="nav">
            🏷️ Categories
        </a>

        <a href="#" class="nav">
            ✍️ Authors
        </a>

        <a href="subscribers.html" class="nav active">
            📧 Subscribers
        </a>

        <a href="settings.html" class="nav">
            ⚙️ Settings
        </a>

        <button class="logout" id="logout">
            🚪 Log out
        </button>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="header">

            <div>

                <h1>
                    Subscribers
                </h1>

                <p>
                    Manage people subscribed to the TechPulse newsletter.
                </p>

            </div>

            <div class="total-card">

                <div class="total-label">
                    TOTAL SUBSCRIBERS
                </div>

                <div
                    class="total-number"
                    id="totalSubscribers">
                    0
                </div>

            </div>

        </div>


        <div id="message"></div>


        <div class="panel">

            <div class="toolbar">

                <input
                    type="search"
                    id="search"
                    class="search"
                    placeholder="Search subscribers by email..."
                    autocomplete="off">

                <button
                    class="refresh"
                    id="refresh"
                    type="button">
                    🔄 Refresh
                </button>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Email
                            </th>

                            <th>
                                Subscribed
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>

                    <tbody id="subscriberList">

                        <tr>

                            <td
                                colspan="3"
                                class="loading">
                                Loading subscribers...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script>

/* =====================================================
   TECHPULSE SUBSCRIBERS ADMIN
   Uses the existing supabaseClient from ../js/supabase.js
===================================================== */

let subscribers = [];


/* =====================================================
   ACCESS GATE
===================================================== */

function showGate(title, message){

    document.getElementById("app").style.display = "none";

    document.getElementById("accessGate").style.display = "block";

    document.getElementById("gateTitle").textContent = title;

    document.getElementById("gateMessage").textContent = message;

}


function showApp(){

    document.getElementById("accessGate").style.display = "none";

    document.getElementById("app").style.display = "flex";

}


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin(){

    try{

        const {
            data,
            error
        } = await supabaseClient.auth.getUser();


        if(error){

            console.error(error);

            showGate(
                "Authentication error",
                error.message
            );

            return false;

        }


        const user = data.user;


        if(!user){

            showGate(
                "Sign in required",
                "You must sign in as an administrator."
            );

            setTimeout(function(){

                window.location.href = "login.html";

            },1200);

            return false;

        }


        const {
            data: profile,
            error: profileError
        } = await supabaseClient
            .from("admin_profiles")
            .select("is_admin")
            .eq("id", user.id)
            .maybeSingle();


        if(profileError){

            console.error(profileError);

            showGate(
                "Unable to verify admin",
                profileError.message
            );

            return false;

        }


        if(!profile || profile.is_admin !== true){

            showGate(
                "Access denied",
                "This page is only available to TechPulse administrators."
            );

            return false;

        }


        return true;

    }catch(error){

        console.error(error);

        showGate(
            "Something went wrong",
            error.message || "Unable to check administrator access."
        );

        return false;

    }

}


/* =====================================================
   LOAD SUBSCRIBERS
===================================================== */

async function loadSubscribers(){

    const list =
        document.getElementById("subscriberList");


    list.innerHTML = `
        <tr>
            <td colspan="3" class="loading">
                Loading subscribers...
            </td>
        </tr>
    `;


    const {
        data,
        error
    } = await supabaseClient
        .from("subscribers")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error("Subscriber loading error:",error);


        list.innerHTML = `
            <tr>
                <td colspan="3" class="error">
                    Failed to load subscribers:<br>
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;


        document.getElementById(
            "totalSubscribers"
        ).textContent = "0";


        return;

    }


    subscribers = data || [];


    document.getElementById(
        "totalSubscribers"
    ).textContent =
        subscribers.length;


    renderSubscribers();

}


/* =====================================================
   RENDER SUBSCRIBERS
===================================================== */

function renderSubscribers(){

    const list =
        document.getElementById(
            "subscriberList"
        );


    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        subscribers.filter(function(subscriber){

            const email =
                String(
                    subscriber.emails || ""
                ).toLowerCase();


            return email.includes(search);

        });


    if(filtered.length === 0){

        list.innerHTML = `
            <tr>
                <td colspan="3" class="empty">
                    ${
                        search
                        ? "No subscribers match your search."
                        : "No subscribers yet."
                    }
                </td>
            </tr>
        `;

        return;

    }


    list.innerHTML =
        filtered.map(function(subscriber){

            const email =
                subscriber.emails || "(no email)";


            const date =
                formatDate(
                    subscriber.created_at
                );


            return `
                <tr>

                    <td class="email">
                        ${escapeHtml(email)}
                    </td>

                    <td class="date">
                        ${escapeHtml(date)}
                    </td>

                    <td>

                        <button
                            class="delete-btn"
                            data-id="${escapeHtml(subscriber.id)}"
                            type="button">
                            Delete
                        </button>

                    </td>

                </tr>
            `;

        }).join("");

}


/* =====================================================
   DELETE SUBSCRIBER
===================================================== */

async function deleteSubscriber(id){

    const subscriber =
        subscribers.find(function(item){

            return String(item.id) === String(id);

        });


    if(!subscriber){

        return;

    }


    const email =
        subscriber.emails || "this subscriber";


    const confirmed =
        confirm(
            "Delete " +
            email +
            " from TechPulse subscribers?"
        );


    if(!confirmed){

        return;

    }


    const buttons =
        document.querySelectorAll(
            '[data-id="' + CSS.escape(String(id)) + '"]'
        );


    buttons.forEach(function(button){

        button.disabled = true;

        button.textContent = "Deleting...";

    });


    const {
        error
    } = await supabaseClient
        .from("subscribers")
        .delete()
        .eq("id",id);


    if(error){

        console.error(error);


        showMessage(
            "Could not delete subscriber: " +
            error.message,
            "error"
        );


        renderSubscribers();

        return;

    }


    subscribers =
        subscribers.filter(function(item){

            return String(item.id) !== String(id);

        });


    document.getElementById(
        "totalSubscribers"
    ).textContent =
        subscribers.length;


    renderSubscribers();


    showMessage(
        "Subscriber deleted successfully.",
        "success"
    );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");


    box.textContent = text;

    box.style.display = "block";


    if(type === "success"){

        box.style.background = "#dcfce7";

        box.style.color = "#166534";

    }else{

        box.style.background = "#fee2e2";

        box.style.color = "#991b1b";

    }


    setTimeout(function(){

        box.style.display = "none";

    },4000);

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date){

    if(!date){

        return "Unknown";

    }


    try{

        return new Date(date).toLocaleString(
            "en-US",
            {
                year:"numeric",
                month:"short",
                day:"numeric",
                hour:"numeric",
                minute:"2-digit"
            }
        );

    }catch{

        return "Unknown";

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderSubscribers
    );


/* =====================================================
   REFRESH
===================================================== */

document
    .getElementById("refresh")
    .addEventListener(
        "click",
        loadSubscribers
    );


/* =====================================================
   DELETE BUTTONS
===================================================== */

document
    .getElementById("subscriberList")
    .addEventListener(
        "click",
        function(event){

            const button =
                event.target.closest(
                    ".delete-btn"
                );


            if(!button){

                return;

            }


            const id =
                button.getAttribute(
                    "data-id"
                );


            deleteSubscriber(id);

        }
    );


/* =====================================================
   LOGOUT
===================================================== */

document
    .getElementById("logout")
    .addEventListener(
        "click",
        async function(){

            await supabaseClient
                .auth
                .signOut();


            window.location.href =
                "login.html";

        }
    );


/* =====================================================
   START
===================================================== */

async function start(){

    showGate(
        "Checking access...",
        "Please wait."
    );


    const allowed =
        await checkAdmin();


    if(!allowed){

        return;

    }


    showApp();


    await loadSubscribers();

}


start();

</script>

</body>
</html>
