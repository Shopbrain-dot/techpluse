<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comments | TechPulse Admin</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your Supabase connection -->
    <script src="../js/supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 250px;
            background: #0b1220;
            color: white;
            padding: 25px 16px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            padding: 0 12px;
            margin-bottom: 35px;
        }

        .logo span {
            color: #60a5fa;
        }

        .section-title {
            color: #94a3b8;
            font-size: 11px;
            font-weight: bold;
            padding: 0 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .nav {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .nav:hover,
        .nav.active {
            background: #1e293b;
            color: white;
        }

        .logout {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #1e293b;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            color: #6b7280;
            margin-top: 7px;
        }

        /* =========================
           MESSAGE
        ========================= */

        #message {
            display: none;
            max-width: 1000px;
            margin-bottom: 18px;
            padding: 13px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
        }

        /* =========================
           TABS
        ========================= */

        .tabs {
            max-width: 1000px;
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            border: 1px solid #e5e7eb;
            background: white;
            color: #374151;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
        }

        .tab.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        /* =========================
           LIST
        ========================= */

        .list {
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .comment-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;
        }

        .comment-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .comment-name {
            font-weight: 800;
            font-size: 15px;
        }

        .comment-meta {
            color: #9ca3af;
            font-size: 12px;
            margin-top: 3px;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-approved {
            background: #dcfce7;
            color: #166534;
        }

        .comment-content {
            color: #374151;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 14px;
        }

        .comment-actions {
            display: flex;
            gap: 8px;
        }

        .comment-actions button {
            border: 0;
            padding: 9px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
        }

        .approve-button {
            background: #2563eb;
            color: white;
        }

        .delete-button {
            background: #fee2e2;
            color: #991b1b;
        }

        .comment-actions button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .loading,
        .empty {
            max-width: 1000px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 40px;
            text-align: center;
            color: #6b7280;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .layout {
                display: block;
            }

            .sidebar {
                position: relative;
                width: 100%;
            }

            .logout {
                position: static;
                width: 100%;
                margin-top: 20px;
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }

            .comment-top {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<div class="layout">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="logo">
            Tech<span>Pulse</span>
        </div>

        <div class="section-title">
            Administration
        </div>

        <a href="dashboard.html" class="nav">
            📊 Dashboard
        </a>

        <a href="articles.html" class="nav">
            📰 Articles
        </a>

        <a href="categories.html" class="nav">
            🏷️ Categories
        </a>

        <a href="authors.html" class="nav">
            ✍️ Authors
        </a>

        <a href="subscribers.html" class="nav">
            📧 Subscribers
        </a>

        <a href="comments.html" class="nav active">
            💬 Comments
        </a>

        <a href="settings.html" class="nav">
            ⚙️ Settings
        </a>

        <button class="logout" id="logout">
            🚪 Log out
        </button>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

        <div class="header">

            <h1>Comments</h1>

            <p>
                Review and approve visitor comments before they appear on TechPulse.
            </p>

        </div>


        <div id="message"></div>


        <div class="tabs">

            <button
                class="tab active"
                id="tabPending"
                type="button">
                Pending
            </button>

            <button
                class="tab"
                id="tabApproved"
                type="button">
                Approved
            </button>

        </div>


        <div id="loading" class="loading">
            Loading comments...
        </div>


        <div id="list" class="list" style="display:none;"></div>

        <div id="empty" class="empty" style="display:none;">
            No comments here.
        </div>

    </main>

</div>


<script>

    let currentTab = "pending";
    let allComments = [];
    let articleTitleMap = {};


    /* =========================================================
       MESSAGE
    ========================================================= */

    function showMessage(text, type) {

        const box =
            document.getElementById("message");

        box.textContent = text;

        box.style.display = "block";


        if (type === "success") {

            box.style.background = "#dcfce7";
            box.style.color = "#166534";

        } else if (type === "error") {

            box.style.background = "#fee2e2";
            box.style.color = "#991b1b";

        } else {

            box.style.background = "#dbeafe";
            box.style.color = "#1e40af";

        }

    }


    /* =========================================================
       ADMIN PROTECTION
    ========================================================= */

    async function checkAdmin() {

        const result =
            await supabaseClient.auth.getUser();


        if (result.error || !result.data.user) {

            window.location.href = "index.html";

            return false;
        }


        const user =
            result.data.user;


        const adminResult =
            await supabaseClient
                .from("admin_profiles")
                .select("is_admin")
                .eq("id", user.id)
                .single();


        if (
            adminResult.error ||
            !adminResult.data ||
            adminResult.data.is_admin !== true
        ) {

            await supabaseClient.auth.signOut();

            window.location.href = "index.html";

            return false;
        }


        return true;

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function formatDate(value) {

        if (!value) {

            return "";

        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {

            return "";

        }

        return date.toLocaleDateString("en-US", {
            year: "numeric",
            month: "short",
            day: "numeric"
        }) + " at " + date.toLocaleTimeString("en-US", {
            hour: "numeric",
            minute: "2-digit"
        });

    }


    /* =========================================================
       LOAD ARTICLE TITLES (for context on each comment)
    ========================================================= */

    async function loadArticleTitles(articleIds) {

        if (!articleIds.length) {

            return;

        }

        const result =
            await supabaseClient
                .from("articles")
                .select("id, title")
                .in("id", articleIds);

        if (!result.error && result.data) {

            result.data.forEach(function (article) {

                articleTitleMap[article.id] = article.title;

            });

        }

    }


    /* =========================================================
       LOAD COMMENTS
    ========================================================= */

    async function loadComments() {

        const loading = document.getElementById("loading");
        const list = document.getElementById("list");
        const empty = document.getElementById("empty");

        loading.style.display = "block";
        list.style.display = "none";
        empty.style.display = "none";


        const result =
            await supabaseClient
                .from("comments")
                .select("*")
                .order("created_at", { ascending: false });


        if (result.error) {

            console.error(result.error);

            loading.textContent =
                "Unable to load comments: " + result.error.message;

            return;

        }


        allComments = result.data || [];


        const articleIds =
            [...new Set(allComments.map(c => c.article_id).filter(Boolean))];

        await loadArticleTitles(articleIds);


        loading.style.display = "none";

        renderList();

    }


    /* =========================================================
       RENDER LIST
    ========================================================= */

    function renderList() {

        const list = document.getElementById("list");
        const empty = document.getElementById("empty");

        const filtered =
            allComments.filter(c => c.status === currentTab);


        if (!filtered.length) {

            list.style.display = "none";

            empty.style.display = "block";

            empty.textContent =
                currentTab === "pending"
                    ? "No comments waiting for approval."
                    : "No approved comments yet.";

            return;

        }


        empty.style.display = "none";

        list.style.display = "flex";

        list.innerHTML = "";


        filtered.forEach(function (comment) {

            const card = document.createElement("div");

            card.className = "comment-card";


            const articleTitle =
                articleTitleMap[comment.article_id] || "Unknown article";


            card.innerHTML = `

                <div class="comment-top">

                    <div>
                        <div class="comment-name">
                            ${escapeHtml(comment.name)}
                        </div>
                        <div class="comment-meta">
                            On "${escapeHtml(articleTitle)}" • ${escapeHtml(formatDate(comment.created_at))}
                        </div>
                    </div>

                    <div class="status-badge status-${escapeHtml(comment.status)}">
                        ${escapeHtml(comment.status)}
                    </div>

                </div>

                <div class="comment-content">
                    ${escapeHtml(comment.content)}
                </div>

                <div class="comment-actions">
                    ${
                        comment.status === "pending"
                            ? `<button class="approve-button" data-id="${comment.id}" data-action="approve">Approve</button>`
                            : ""
                    }
                    <button class="delete-button" data-id="${comment.id}" data-action="delete">Delete</button>
                </div>
            `;


            list.appendChild(card);

        });


        list.querySelectorAll("button[data-action]").forEach(function (button) {

            button.addEventListener("click", function () {

                const id = button.getAttribute("data-id");
                const action = button.getAttribute("data-action");

                if (action === "approve") {

                    approveComment(id, button);

                } else if (action === "delete") {

                    deleteComment(id, button);

                }

            });

        });

    }


    /* =========================================================
       APPROVE
    ========================================================= */

    async function approveComment(id, button) {

        button.disabled = true;

        const result =
            await supabaseClient
                .from("comments")
                .update({ status: "approved" })
                .eq("id", id);


        if (result.error) {

            console.error(result.error);

            showMessage("Unable to approve comment: " + result.error.message, "error");

            button.disabled = false;

            return;

        }


        showMessage("Comment approved.", "success");

        const target = allComments.find(c => c.id === id);

        if (target) {

            target.status = "approved";

        }

        renderList();

    }


    /* =========================================================
       DELETE
    ========================================================= */

    async function deleteComment(id, button) {

        if (!confirm("Delete this comment permanently?")) {

            return;

        }

        button.disabled = true;

        const result =
            await supabaseClient
                .from("comments")
                .delete()
                .eq("id", id);


        if (result.error) {

            console.error(result.error);

            showMessage("Unable to delete comment: " + result.error.message, "error");

            button.disabled = false;

            return;

        }


        showMessage("Comment deleted.", "success");

        allComments = allComments.filter(c => c.id !== id);

        renderList();

    }


    /* =========================================================
       TABS
    ========================================================= */

    document.getElementById("tabPending").addEventListener("click", function () {

        currentTab = "pending";

        document.getElementById("tabPending").classList.add("active");
        document.getElementById("tabApproved").classList.remove("active");

        renderList();

    });


    document.getElementById("tabApproved").addEventListener("click", function () {

        currentTab = "approved";

        document.getElementById("tabApproved").classList.add("active");
        document.getElementById("tabPending").classList.remove("active");

        renderList();

    });


    /* =========================================================
       LOGOUT
    ========================================================= */

    document
        .getElementById("logout")
        .addEventListener("click", async function () {

            await supabaseClient.auth.signOut();

            window.location.href = "index.html";

        });


    /* =========================================================
       START
    ========================================================= */

    async function start() {

        const allowed = await checkAdmin();

        if (!allowed) {
            return;
        }

        await loadComments();

    }

    start();

</script>

</body>
</html>
