<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Articles | TechPulse Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            background: #0b1220;
            color: white;
            padding: 24px 16px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            padding: 0 12px;
            margin-bottom: 35px;
        }

        .logo span {
            color: #60a5fa;
        }

        .admin-label {
            padding: 0 12px;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .nav-item {
            display: block;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 9px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #1e293b;
            color: white;
        }

        .logout {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 20px;
            border: 0;
            background: #1e293b;
            color: #cbd5e1;
            padding: 12px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 30px;
        }

        .topbar p {
            color: #6b7280;
            margin-top: 5px;
            font-size: 14px;
        }

        .new-button {
            border: 0;
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .new-button:hover {
            background: #1d4ed8;
        }

        /* TABLE */

        .table-container {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            color: #6b7280;
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .title {
            font-weight: 800;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
        }

        .published {
            background: #dcfce7;
            color: #166534;
        }

        .draft {
            background: #fef3c7;
            color: #92400e;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .action-button {
            border: 1px solid #d1d5db;
            background: white;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .delete {
            color: #dc2626;
        }

        .empty {
            padding: 50px 20px;
            text-align: center;
            color: #6b7280;
        }

        .loading {
            padding: 50px 20px;
            text-align: center;
            color: #6b7280;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .layout {
                display: block;
            }

            .sidebar {
                position: relative;
                width: 100%;
            }

            .logout {
                position: static;
                width: 100%;
                margin-top: 20px;
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .new-button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            Tech<span>Pulse</span>
        </div>

        <div class="admin-label">
            Administration
        </div>

        <a href="dashboard.html" class="nav-item">
            📊 Dashboard
        </a>

        <a href="articles.html" class="nav-item active">
            📰 Articles
        </a>

        <a href="#" class="nav-item">
            🏷️ Categories
        </a>

        <a href="#" class="nav-item">
            ✍️ Authors
        </a>

        <a href="#" class="nav-item">
            📧 Subscribers
        </a>

        <a href="#" class="nav-item">
            ⚙️ Settings
        </a>

        <button class="logout" id="logoutButton">
            🚪 Log out
        </button>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="topbar">

            <div>
                <h1>Articles</h1>

                <p>
                    Create and manage TechPulse news stories.
                </p>
            </div>

            <a href="create-article.html" class="new-button">
                + New Article
            </a>

        </div>


        <div class="table-container">

            <div id="loading" class="loading">
                Loading articles...
            </div>

            <table id="articlesTable" style="display:none;">

                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Views</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="articlesBody"></tbody>

            </table>

            <div id="empty" class="empty" style="display:none;">
                <h3>No articles yet</h3>
                <p>Create your first TechPulse article.</p>
            </div>

        </div>

    </main>

</div>


<script>

    /* =========================
       ADMIN PROTECTION
    ========================= */

    async function protectPage() {

        const {
            data: { user },
            error
        } = await supabaseClient.auth.getUser();

        if (error || !user) {
            window.location.href = "index.html";
            return false;
        }

        const { data: admin, error: adminError } =
            await supabaseClient
                .from("admin_profiles")
                .select("is_admin")
                .eq("id", user.id)
                .single();

        if (
            adminError ||
            !admin ||
            admin.is_admin !== true
        ) {

            await supabaseClient.auth.signOut();

            window.location.href = "index.html";

            return false;
        }

        return true;
    }


    /* =========================
       LOAD ARTICLES
    ========================= */

    async function loadArticles() {

        const loading =
            document.getElementById("loading");

        const table =
            document.getElementById("articlesTable");

        const empty =
            document.getElementById("empty");

        const body =
            document.getElementById("articlesBody");


        const { data, error } =
            await supabaseClient
                .from("articles")
                .select(`
                    id,
                    title,
                    status,
                    views,
                    created_at,
                    categories (
                        name
                    )
                `)
                .order("created_at", {
                    ascending: false
                });


        loading.style.display = "none";


        if (error) {

            console.error(error);

            empty.style.display = "block";

            empty.innerHTML =
                "<h3>Unable to load articles</h3>" +
                "<p>" + error.message + "</p>";

            return;
        }


        if (!data || data.length === 0) {

            empty.style.display = "block";

            return;
        }


        table.style.display = "table";


        body.innerHTML = data.map(article => {

            const date =
                new Date(article.created_at)
                    .toLocaleDateString();


            const category =
                article.categories?.name ||
                "Uncategorized";


            return `
                <tr>

                    <td>
                        <div class="title">
                            ${escapeHtml(article.title)}
                        </div>
                    </td>

                    <td>
                        ${escapeHtml(category)}
                    </td>

                    <td>
                        <span class="status ${
                            article.status === "published"
                                ? "published"
                                : "draft"
                        }">
                            ${article.status}
                        </span>
                    </td>

                    <td>
                        ${article.views || 0}
                    </td>

                    <td>
                        ${date}
                    </td>

                    <td>

                        <div class="actions">

                            <button
                                class="action-button"
                                onclick="editArticle('${article.id}')"
                            >
                                Edit
                            </button>

                            <button
                                class="action-button delete"
                                onclick="deleteArticle('${article.id}')"
                            >
                                Delete
                            </button>

                        </div>

                    </td>

                </tr>
            `;

        }).join("");

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================
       EDIT
    ========================= */

    function editArticle(id) {

        window.location.href =
            "create-article.html?id=" +
            encodeURIComponent(id);

    }


    /* =========================
       DELETE
    ========================= */

    async function deleteArticle(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this article?"
            );

        if (!confirmed) return;


        const { error } =
            await supabaseClient
                .from("articles")
                .delete()
                .eq("id", id);


        if (error) {

            alert(
                "Unable to delete article: " +
                error.message
            );

            return;
        }


        await loadArticles();

    }


    /* =========================
       LOGOUT
    ========================= */

    document
        .getElementById("logoutButton")
        .addEventListener("click", async function () {

            await supabaseClient.auth.signOut();

            window.location.href = "index.html";

        });


    /* =========================
       START
    ========================= */

    async function start() {

        const allowed =
            await protectPage();

        if (!allowed) return;

        await loadArticles();

    }

    start();

</script>

</body>
</html>
