<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechPulse</title>

<meta
    name="description"
    id="metaDescription"
    content="Latest technology news from TechPulse."
>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#111827;
    line-height:1.7;
}

/* =========================
   HEADER
========================= */

.header{
    background:#0b1220;
    color:white;
    padding:18px 20px;
}

.header-inner{
    max-width:1000px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:25px;
    font-weight:900;
    text-decoration:none;
    color:white;
}

.logo span{
    color:#60a5fa;
}

.back-link{
    color:#cbd5e1;
    text-decoration:none;
    font-size:14px;
    font-weight:700;
}

.back-link:hover{
    color:white;
}

/* =========================
   MAIN
========================= */

.container{
    width:100%;
    max-width:900px;
    margin:40px auto;
    padding:0 20px;
}

.article-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    overflow:hidden;
}

/* =========================
   ARTICLE
========================= */

.article-content{
    padding:35px;
}

.category{
    display:inline-block;
    background:#dbeafe;
    color:#1d4ed8;
    padding:6px 11px;
    border-radius:999px;
    font-size:12px;
    font-weight:800;
    margin-bottom:15px;
}

.article-title{
    font-size:42px;
    line-height:1.2;
    margin-bottom:15px;
    color:#111827;
}

.article-meta{
    color:#6b7280;
    font-size:14px;
    margin-bottom:25px;
}

.featured-image{
    width:100%;
    max-height:500px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:30px;
    display:block;
}

.excerpt{
    font-size:19px;
    font-weight:600;
    color:#4b5563;
    margin-bottom:25px;
    line-height:1.7;
}

.article-body{
    font-size:17px;
    color:#374151;
    line-height:1.9;
}

.article-body p{
    margin-bottom:20px;
}

.article-body h2{
    font-size:27px;
    margin:30px 0 15px;
    color:#111827;
}

.article-body h3{
    font-size:22px;
    margin:25px 0 12px;
    color:#111827;
}

.article-body ul,
.article-body ol{
    margin:15px 0 20px 25px;
}

.article-body li{
    margin-bottom:8px;
}

.article-body a{
    color:#2563eb;
    text-decoration:underline;
}

/* =========================
   SHARE
========================= */

.share-section{
    border-top:1px solid #e5e7eb;
    margin-top:35px;
    padding-top:25px;
}

.share-section h3{
    margin-bottom:12px;
}

.share-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.share-btn{
    border:0;
    padding:11px 16px;
    border-radius:8px;
    color:white;
    cursor:pointer;
    font-weight:700;
}

.whatsapp{
    background:#25d366;
}

.facebook{
    background:#1877f2;
}

.x{
    background:#111827;
}

.copy{
    background:#475569;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:80px 20px;
    color:#6b7280;
}

.spinner{
    width:40px;
    height:40px;
    border:4px solid #e5e7eb;
    border-top-color:#2563eb;
    border-radius:50%;
    margin:0 auto 20px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   ERROR
========================= */

.error{
    text-align:center;
    padding:70px 20px;
}

.error h1{
    font-size:30px;
    margin-bottom:10px;
}

.error p{
    color:#6b7280;
    margin-bottom:20px;
}

.home-button{
    display:inline-block;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:8px;
    font-weight:700;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    color:#6b7280;
    padding:30px 20px;
    font-size:13px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header-inner{
        align-items:flex-start;
    }

    .article-content{
        padding:22px;
    }

    .article-title{
        font-size:31px;
    }

    .excerpt{
        font-size:17px;
    }

    .article-body{
        font-size:16px;
    }

    .share-buttons{
        flex-direction:column;
    }

    .share-btn{
        width:100%;
    }

}

</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-inner">

        <a
            href="./index.html"
            class="logo"
        >
            Tech<span>Pulse</span>
        </a>

        <a
            href="./index.html"
            class="back-link"
        >
            ← Back to TechPulse
        </a>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">

    <div
        id="loading"
        class="loading"
    >

        <div class="spinner"></div>

        <p>
            Loading article...
        </p>

    </div>


    <div
        id="error"
        class="error"
        style="display:none;"
    >

        <h1>
            Article not found
        </h1>

        <p id="errorMessage">
            We couldn't find this article.
        </p>

        <a
            href="./index.html"
            class="home-button"
        >
            Go to TechPulse
        </a>

    </div>


    <article
        id="articleCard"
        class="article-card"
        style="display:none;"
    >

        <div class="article-content">

            <span
                id="articleCategory"
                class="category"
            >
                Technology
            </span>


            <h1
                id="articleTitle"
                class="article-title"
            >
                Article title
            </h1>


            <div
                id="articleMeta"
                class="article-meta"
            >
                TechPulse
            </div>


            <img
                id="featuredImage"
                class="featured-image"
                style="display:none;"
                alt=""
            >


            <div
                id="articleExcerpt"
                class="excerpt"
                style="display:none;"
            ></div>


            <div
                id="articleBody"
                class="article-body"
            ></div>


            <div class="share-section">

                <h3>
                    Share this article
                </h3>

                <div class="share-buttons">

                    <button
                        id="whatsappButton"
                        class="share-btn whatsapp"
                        type="button"
                    >
                        WhatsApp
                    </button>


                    <button
                        id="facebookButton"
                        class="share-btn facebook"
                        type="button"
                    >
                        Facebook
                    </button>


                    <button
                        id="xButton"
                        class="share-btn x"
                        type="button"
                    >
                        X
                    </button>


                    <button
                        id="copyButton"
                        class="share-btn copy"
                        type="button"
                    >
                        📋 Copy Link
                    </button>

                </div>

            </div>

        </div>

    </article>

</main>


<footer class="footer">

    © <span id="year"></span> TechPulse.
    All rights reserved.

</footer>


<script>

/* =====================================================
   GET SLUG FROM URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const slug =
    params.get("slug");


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const errorMessage =
    document.getElementById("errorMessage");

const articleCard =
    document.getElementById("articleCard");


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   CONTENT FORMATTER
===================================================== */

function formatContent(content){

    if(!content){
        return "";
    }

    /*
     * The content is escaped first so article text
     * cannot inject arbitrary HTML.
     */

    return escapeHtml(content)
        .replace(/\r\n/g,"\n")
        .replace(/\n\n+/g,"</p><p>")
        .replace(/\n/g,"<br>");
}


/* =====================================================
   LOAD ARTICLE
===================================================== */

async function loadArticle(){

    if(!slug){

        showError(
            "No article slug was provided in the URL."
        );

        return;

    }


    try{

        const {
            data: article,
            error
        } =
        await supabaseClient
            .from("articles")
            .select(`
                id,
                title,
                slug,
                excerpt,
                content,
                featured_image,
                status,
                views,
                created_at,
                categories (
                    name
                )
            `)
            .eq("slug",slug)
            .eq("status","published")
            .maybeSingle();


        if(error){

            console.error(
                "Supabase article error:",
                error
            );

            showError(
                error.message
            );

            return;

        }


        if(!article){

            showError(
                "This article does not exist or has not been published."
            );

            return;

        }


        displayArticle(article);


        /*
         * Increase views.
         *
         * We do this after displaying the article so
         * a failure here does not prevent the article
         * from loading.
         */

        increaseViews(article);


    }catch(error){

        console.error(
            "Article loading error:",
            error
        );

        showError(
            error.message ||
            "Unable to load this article."
        );

    }

}


/* =====================================================
   DISPLAY ARTICLE
===================================================== */

function displayArticle(article){

    document.title =
        article.title +
        " | TechPulse";


    document
        .getElementById("metaDescription")
        .setAttribute(
            "content",
            article.excerpt ||
            "Read the latest technology news on TechPulse."
        );


    document
        .getElementById("articleTitle")
        .textContent =
        article.title ||
        "Untitled Article";


    document
        .getElementById("articleCategory")
        .textContent =
        article.categories?.name ||
        "Technology";


    const date =
        article.created_at
        ? new Date(
            article.created_at
        ).toLocaleDateString(
            "en-US",
            {
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        )
        : "";


    document
        .getElementById("articleMeta")
        .textContent =
        date
        ? "TechPulse • " + date
        : "TechPulse";


    /* FEATURED IMAGE */

    const image =
        document.getElementById(
            "featuredImage"
        );


    if(article.featured_image){

        image.src =
            article.featured_image;

        image.alt =
            article.title || "TechPulse article";

        image.style.display =
            "block";

        image.onerror =
            function(){

                this.style.display =
                    "none";

            };

    }


    /* EXCERPT */

    const excerpt =
        document.getElementById(
            "articleExcerpt"
        );


    if(article.excerpt){

        excerpt.textContent =
            article.excerpt;

        excerpt.style.display =
            "block";

    }


    /* CONTENT */

    const body =
        document.getElementById(
            "articleBody"
        );


    body.innerHTML =
        "<p>" +
        formatContent(
            article.content || ""
        ) +
        "</p>";


    loading.style.display =
        "none";


    articleCard.style.display =
        "block";

}


/* =====================================================
   INCREASE VIEWS
===================================================== */

async function increaseViews(article){

    try{

        const newViews =
            Number(article.views || 0) + 1;


        await supabaseClient
            .from("articles")
            .update({
                views:newViews
            })
            .eq("id",article.id);


    }catch(error){

        console.warn(
            "Could not update article views:",
            error
        );

    }

}


/* =====================================================
   ERROR
===================================================== */

function showError(message){

    loading.style.display =
        "none";


    articleCard.style.display =
        "none";


    errorBox.style.display =
        "block";


    errorMessage.textContent =
        message ||
        "We couldn't find this article.";

}


/* =====================================================
   CURRENT ARTICLE URL
===================================================== */

function getCurrentArticleUrl(){

    return window.location.href;

}


/* =====================================================
   WHATSAPP
===================================================== */

document
    .getElementById("whatsappButton")
    .addEventListener(
        "click",
        function(){

            const url =
                getCurrentArticleUrl();


            const title =
                document
                    .getElementById(
                        "articleTitle"
                    )
                    .textContent;


            const text =
                title +
                "\n\nRead it on TechPulse:\n" +
                url;


            window.open(
                "https://wa.me/?text=" +
                encodeURIComponent(text),
                "_blank"
            );

        }
    );


/* =====================================================
   FACEBOOK
===================================================== */

document
    .getElementById("facebookButton")
    .addEventListener(
        "click",
        function(){

            const url =
                getCurrentArticleUrl();


            window.open(
                "https://www.facebook.com/sharer/sharer.php?u=" +
                encodeURIComponent(url),
                "_blank"
            );

        }
    );


/* =====================================================
   X
===================================================== */

document
    .getElementById("xButton")
    .addEventListener(
        "click",
        function(){

            const url =
                getCurrentArticleUrl();


            const title =
                document
                    .getElementById(
                        "articleTitle"
                    )
                    .textContent;


            window.open(
                "https://twitter.com/intent/tweet?text=" +
                encodeURIComponent(title) +
                "&url=" +
                encodeURIComponent(url),
                "_blank"
            );

        }
    );


/* =====================================================
   COPY
===================================================== */

document
    .getElementById("copyButton")
    .addEventListener(
        "click",
        async function(){

            const url =
                getCurrentArticleUrl();


            try{

                await navigator.clipboard.writeText(
                    url
                );


                this.textContent =
                    "✓ Link Copied";


                setTimeout(
                    () => {

                        this.textContent =
                            "📋 Copy Link";

                    },
                    2000
                );


            }catch(error){

                alert(url);

            }

        }
    );


/* =====================================================
   YEAR
===================================================== */

document
    .getElementById("year")
    .textContent =
    new Date().getFullYear();


/* =====================================================
   START
===================================================== */

loadArticle();

</script>

</body>
</html>
