<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Categories | TechPulse</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#111827;
}

.layout{
    min-height:100vh;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:250px;
    background:#0b1220;
    color:white;
    padding:25px 16px;
    position:fixed;
    top:0;
    left:0;
    bottom:0;
}

.logo{
    font-size:25px;
    font-weight:900;
    padding:0 12px;
    margin-bottom:35px;
}

.logo span{
    color:#60a5fa;
}

.section-title{
    color:#94a3b8;
    font-size:11px;
    font-weight:bold;
    padding:0 12px;
    margin-bottom:10px;
    text-transform:uppercase;
}

.nav{
    display:block;
    color:#cbd5e1;
    text-decoration:none;
    padding:12px;
    margin-bottom:5px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
}

.nav:hover,
.nav.active{
    background:#1e293b;
    color:white;
}

.logout{
    position:absolute;
    bottom:20px;
    left:16px;
    right:16px;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#1e293b;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

/* MAIN */

.main{
    margin-left:250px;
    width:calc(100% - 250px);
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    color:#6b7280;
    margin:7px 0 0;
}

/* BUTTON */

.primary-button{
    border:0;
    background:#2563eb;
    color:white;
    padding:13px 18px;
    border-radius:9px;
    font-weight:800;
    cursor:pointer;
}

.primary-button:hover{
    background:#1d4ed8;
}

/* PANEL */

.panel{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:22px;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    font-size:12px;
    color:#6b7280;
    text-transform:uppercase;
    padding:13px;
    border-bottom:1px solid #e5e7eb;
}

td{
    padding:15px 13px;
    border-bottom:1px solid #e5e7eb;
    font-size:14px;
}

tr:last-child td{
    border-bottom:0;
}

.category-name{
    font-weight:800;
}

.slug{
    color:#6b7280;
}

.description{
    color:#6b7280;
    max-width:350px;
}

.actions{
    display:flex;
    gap:7px;
}

.action{
    border:0;
    padding:8px 11px;
    border-radius:7px;
    cursor:pointer;
    font-weight:700;
    font-size:12px;
}

.edit{
    background:#eff6ff;
    color:#2563eb;
}

.delete{
    background:#fef2f2;
    color:#dc2626;
}

.empty{
    text-align:center;
    color:#6b7280;
    padding:35px;
}

.error{
    background:#fef2f2;
    color:#dc2626;
    padding:13px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:13px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:500;
}

.modal-box{
    background:white;
    width:100%;
    max-width:500px;
    border-radius:15px;
    padding:25px;
}

.modal-box h2{
    margin-top:0;
}

label{
    display:block;
    font-weight:700;
    font-size:13px;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
    font-family:inherit;
    margin-bottom:17px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:#2563eb;
}

.modal-actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
}

.cancel{
    border:1px solid #d1d5db;
    background:white;
    padding:11px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.save{
    border:0;
    background:#2563eb;
    color:white;
    padding:11px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

/* MESSAGE */

#message{
    display:none;
    margin-bottom:15px;
    padding:12px;
    border-radius:8px;
    font-size:13px;
}

/* MOBILE */

@media(max-width:700px){

    .layout{
        display:block;
    }

    .sidebar{
        position:relative;
        width:100%;
    }

    .logout{
        position:static;
        width:100%;
        margin-top:20px;
    }

    .main{
        margin-left:0;
        width:100%;
        padding:20px;
    }

    .header{
        align-items:flex-start;
        flex-direction:column;
    }

    .actions{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="layout">

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        Tech<span>Pulse</span>
    </div>

    <div class="section-title">
        Administration
    </div>

    <a href="dashboard.html" class="nav">
        📊 Dashboard
    </a>

    <a href="articles.html" class="nav">
        📰 Articles
    </a>

    <a href="categories.html" class="nav active">
        🏷️ Categories
    </a>

    <a href="authors.html" class="nav">
        ✍️ Authors
    </a>

    <a href="subscribers.html" class="nav">
        📧 Subscribers
    </a>

    <a href="settings.html" class="nav">
        ⚙️ Settings
    </a>

    <button class="logout" id="logout">
        🚪 Log out
    </button>

</aside>


<!-- MAIN -->

<main class="main">

    <div class="header">

        <div>
            <h1>Categories</h1>

            <p>
                Manage the categories used for TechPulse articles.
            </p>
        </div>

        <button
            class="primary-button"
            id="addCategory"
        >
            + Add Category
        </button>

    </div>


    <div id="message"></div>


    <div class="panel">

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Slug</th>
                        <th>Description</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="categoryList">

                    <tr>
                        <td
                            colspan="5"
                            class="empty"
                        >
                            Loading categories...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

</div>


<!-- MODAL -->

<div class="modal" id="categoryModal">

    <div class="modal-box">

        <h2 id="modalTitle">
            Add Category
        </h2>

        <form id="categoryForm">

            <input
                type="hidden"
                id="categoryId"
            >

            <label for="categoryName">
                Category Name
            </label>

            <input
                type="text"
                id="categoryName"
                placeholder="e.g. Artificial Intelligence"
                required
            >

            <label for="categorySlug">
                Slug
            </label>

            <input
                type="text"
                id="categorySlug"
                placeholder="e.g. artificial-intelligence"
                required
            >

            <label for="categoryDescription">
                Description
            </label>

            <textarea
                id="categoryDescription"
                placeholder="Describe this category..."
            ></textarea>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel"
                    id="cancelButton"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save"
                    id="saveButton"
                >
                    Save Category
                </button>

            </div>

        </form>

    </div>

</div>


<script>

/* =====================================
   ELEMENTS
===================================== */

const categoryList =
    document.getElementById("categoryList");

const modal =
    document.getElementById("categoryModal");

const modalTitle =
    document.getElementById("modalTitle");

const categoryForm =
    document.getElementById("categoryForm");

const categoryId =
    document.getElementById("categoryId");

const categoryName =
    document.getElementById("categoryName");

const categorySlug =
    document.getElementById("categorySlug");

const categoryDescription =
    document.getElementById("categoryDescription");

const message =
    document.getElementById("message");

const saveButton =
    document.getElementById("saveButton");


/* =====================================
   MESSAGE
===================================== */

function showMessage(text,type){

    message.textContent=text;

    message.style.display="block";

    if(type==="success"){

        message.style.background="#f0fdf4";
        message.style.color="#16a34a";

    }else{

        message.style.background="#fef2f2";
        message.style.color="#dc2626";

    }

}


/* =====================================
   CHECK ADMIN
===================================== */

async function checkAdmin(){

    const {data,error} =
        await supabaseClient.auth.getUser();

    if(error || !data.user){

        location.href="index.html";

        return false;
    }

    const result =
        await supabaseClient
        .from("admin_profiles")
        .select("is_admin")
        .eq("id",data.user.id)
        .single();

    if(
        result.error ||
        !result.data ||
        result.data.is_admin !== true
    ){

        await supabaseClient.auth.signOut();

        location.href="index.html";

        return false;
    }

    return true;
}


/* =====================================
   LOAD CATEGORIES
===================================== */

async function loadCategories(){

    categoryList.innerHTML=`
        <tr>
            <td colspan="5" class="empty">
                Loading categories...
            </td>
        </tr>
    `;


    const {data,error} =
        await supabaseClient
        .from("categories")
        .select("*")
        .order("name",{ascending:true});


    if(error){

        categoryList.innerHTML=`
            <tr>
                <td colspan="5" class="empty">
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

        return;
    }


    if(!data || data.length===0){

        categoryList.innerHTML=`
            <tr>
                <td colspan="5" class="empty">
                    No categories found.
                </td>
            </tr>
        `;

        return;
    }


    categoryList.innerHTML =
        data.map(category=>{

            const date =
                new Date(category.created_at)
                .toLocaleDateString();


            return `

                <tr>

                    <td>
                        <div class="category-name">
                            ${escapeHtml(category.name)}
                        </div>
                    </td>

                    <td>
                        <div class="slug">
                            ${escapeHtml(category.slug)}
                        </div>
                    </td>

                    <td>
                        <div class="description">
                            ${escapeHtml(
                                category.description || "—"
                            )}
                        </div>
                    </td>

                    <td>
                        ${date}
                    </td>

                    <td>

                        <div class="actions">

                            <button
                                class="action edit"
                                onclick="editCategory(
                                    '${category.id}'
                                )"
                            >
                                Edit
                            </button>

                            <button
                                class="action delete"
                                onclick="deleteCategory(
                                    '${category.id}',
                                    '${escapeAttribute(category.name)}'
                                )"
                            >
                                Delete
                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }).join("");

}


/* =====================================
   OPEN ADD MODAL
===================================== */

document
.getElementById("addCategory")
.addEventListener("click",()=>{

    categoryForm.reset();

    categoryId.value="";

    modalTitle.textContent="Add Category";

    saveButton.textContent="Save Category";

    modal.style.display="flex";

    categoryName.focus();

});


/* =====================================
   CLOSE MODAL
===================================== */

document
.getElementById("cancelButton")
.addEventListener("click",closeModal);


modal.addEventListener("click",function(event){

    if(event.target===modal){

        closeModal();

    }

});


function closeModal(){

    modal.style.display="none";

}


/* =====================================
   AUTO SLUG
===================================== */

categoryName.addEventListener("input",function(){

    if(categoryId.value){

        return;
    }

    categorySlug.value =
        categoryName.value
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-+|-+$/g,"");

});


/* =====================================
   SAVE CATEGORY
===================================== */

categoryForm.addEventListener(
"submit",
async function(event){

    event.preventDefault();

    const name =
        categoryName.value.trim();

    const slug =
        categorySlug.value.trim();

    const description =
        categoryDescription.value.trim();


    if(!name || !slug){

        showMessage(
            "Category name and slug are required.",
            "error"
        );

        return;
    }


    saveButton.disabled=true;
    saveButton.textContent="Saving...";


    try{

        /* EDIT */

        if(categoryId.value){

            const {error} =
                await supabaseClient
                .from("categories")
                .update({
                    name:name,
                    slug:slug,
                    description:
                        description || null
                })
                .eq("id",categoryId.value);


            if(error) throw error;


            showMessage(
                "Category updated successfully.",
                "success"
            );

        }

        /* CREATE */

        else{

            const {error} =
                await supabaseClient
                .from("categories")
                .insert({
                    name:name,
                    slug:slug,
                    description:
                        description || null
                });


            if(error) throw error;


            showMessage(
                "Category created successfully.",
                "success"
            );

        }


        closeModal();

        await loadCategories();


    }catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Unable to save category.",
            "error"
        );

    }finally{

        saveButton.disabled=false;
        saveButton.textContent="Save Category";

    }

});


/* =====================================
   EDIT CATEGORY
===================================== */

async function editCategory(id){

    const {data,error} =
        await supabaseClient
        .from("categories")
        .select("*")
        .eq("id",id)
        .single();


    if(error){

        showMessage(
            error.message,
            "error"
        );

        return;
    }


    categoryId.value=data.id;

    categoryName.value=data.name || "";

    categorySlug.value=data.slug || "";

    categoryDescription.value =
        data.description || "";


    modalTitle.textContent="Edit Category";

    saveButton.textContent="Update Category";

    modal.style.display="flex";

}


/* =====================================
   DELETE CATEGORY
===================================== */

async function deleteCategory(id,name){

    const confirmed =
        confirm(
            `Delete the category "${name}"?`
        );


    if(!confirmed){

        return;
    }


    const {error} =
        await supabaseClient
        .from("categories")
        .delete()
        .eq("id",id);


    if(error){

        showMessage(
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Category deleted successfully.",
        "success"
    );


    await loadCategories();

}


/* =====================================
   HTML SECURITY
===================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;");

}


/* =====================================
   LOGOUT
===================================== */

document
.getElementById("logout")
.addEventListener("click",async()=>{

    await supabaseClient.auth.signOut();

    location.href="index.html";

});


/* =====================================
   START
===================================== */

async function start(){

    const allowed =
        await checkAdmin();

    if(!allowed){

        return;
    }

    await loadCategories();

}


start();

</script>

</body>
</html>
