<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Article - TechPulse</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your Supabase connection -->
    <script src="../js/supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            background: #0b1220;
            color: white;
            padding: 25px 16px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            padding: 0 12px;
            margin-bottom: 35px;
        }

        .logo span {
            color: #60a5fa;
        }

        .section-title {
            color: #94a3b8;
            font-size: 11px;
            font-weight: bold;
            padding: 0 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .nav {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .nav:hover,
        .nav.active {
            background: #1e293b;
            color: white;
        }

        .logout {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #1e293b;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            color: #6b7280;
            margin-top: 7px;
        }

        .editor {
            background: white;
            max-width: 1000px;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 25px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 13px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.7;
        }

        #excerpt {
            min-height: 120px;
        }

        .help {
            color: #6b7280;
            font-size: 12px;
            margin-top: 6px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
            margin-top: 10px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 13px 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .draft {
            background: #e5e7eb;
            color: #111827;
        }

        .publish {
            background: #2563eb;
            color: white;
        }

        .cancel {
            background: white;
            border: 1px solid #d1d5db;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #message {
            display: none;
            max-width: 1000px;
            margin-bottom: 15px;
            padding: 13px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .layout {
                display: block;
            }

            .sidebar {
                position: relative;
                width: auto;
            }

            .logout {
                position: static;
                width: 100%;
                margin-top: 20px;
            }

            .main {
                margin-left: 0;
                width: auto;
                padding: 20px;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            Tech<span>Pulse</span>
        </div>

        <div class="section-title">
            Administration
        </div>

        <a href="dashboard.html" class="nav">
            📊 Dashboard
        </a>

        <a href="articles.html" class="nav active">
            📰 Articles
        </a>

        <a href="#" class="nav">
            🏷️ Categories
        </a>

        <a href="#" class="nav">
            ✍️ Authors
        </a>

        <a href="#" class="nav">
            📧 Subscribers
        </a>

        <a href="#" class="nav">
            ⚙️ Settings
        </a>

        <button class="logout" id="logout">
            🚪 Log out
        </button>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="header">

            <h1 id="pageTitle">
                Create Article
            </h1>

            <p>
                Write and publish a new TechPulse story.
            </p>

        </div>


        <div id="message"></div>


        <form class="editor" id="articleForm">

            <!-- TITLE -->

            <div class="field">

                <label for="title">
                    Article Title
                </label>

                <input
                    id="title"
                    type="text"
                    placeholder="Enter article headline"
                    required
                >

            </div>


            <!-- SLUG -->

            <div class="field">

                <label for="slug">
                    URL Slug
                </label>

                <input
                    id="slug"
                    type="text"
                    placeholder="article-headline"
                    required
                >

                <div class="help">
                    Example: apple-announces-new-ai-model
                </div>

            </div>


            <!-- EXCERPT -->

            <div class="field">

                <label for="excerpt">
                    Short Description
                </label>

                <textarea
                    id="excerpt"
                    placeholder="Write a short description of the article..."
                ></textarea>

            </div>


            <!-- CONTENT -->

            <div class="field">

                <label for="content">
                    Article Content
                </label>

                <textarea
                    id="content"
                    placeholder="Write your full article here..."
                    required
                ></textarea>

            </div>


            <!-- IMAGE -->

            <div class="field">

                <label for="featuredImage">
                    Featured Image URL
                </label>

                <input
                    id="featuredImage"
                    type="url"
                    placeholder="https://example.com/image.jpg"
                >

            </div>


            <!-- CATEGORY / AUTHOR -->

            <div class="row">

                <div class="field">

                    <label for="category">
                        Category
                    </label>

                    <select id="category">

                        <option value="">
                            Select category
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label for="author">
                        Author
                    </label>

                    <select id="author">

                        <option value="">
                            No author
                        </option>

                    </select>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="button"
                    class="draft"
                    id="saveDraft"
                >
                    💾 Save Draft
                </button>

                <button
                    type="button"
                    class="publish"
                    id="publish"
                >
                    📤 Publish Article
                </button>

                <button
                    type="button"
                    class="cancel"
                    onclick="location.href='articles.html'"
                >
                    Cancel
                </button>

            </div>

        </form>

    </main>

</div>


<script>

    let user = null;
    let editingId = null;


    /* ==============================
       MESSAGE
    ============================== */

    function message(text, type) {

        const box =
            document.getElementById("message");

        box.textContent = text;
        box.style.display = "block";

        if (type === "error") {
            box.style.background = "#fee2e2";
            box.style.color = "#991b1b";
        }

        if (type === "success") {
            box.style.background = "#dcfce7";
            box.style.color = "#166534";
        }

        if (type === "info") {
            box.style.background = "#dbeafe";
            box.style.color = "#1e40af";
        }
    }


    /* ==============================
       CHECK ADMIN
    ============================== */

    async function checkAdmin() {

        const result =
            await supabaseClient.auth.getUser();

        user = result.data.user;

        if (!user) {

            location.href = "index.html";

            return false;
        }


        const adminResult =
            await supabaseClient
                .from("admin_profiles")
                .select("is_admin")
                .eq("id", user.id)
                .single();


        if (
            adminResult.error ||
            !adminResult.data ||
            adminResult.data.is_admin !== true
        ) {

            await supabaseClient.auth.signOut();

            location.href = "index.html";

            return false;
        }

        return true;
    }


    /* ==============================
       LOAD CATEGORIES
    ============================== */

    async function loadCategories() {

        const select =
            document.getElementById("category");


        const result =
            await supabaseClient
                .from("categories")
                .select("id,name")
                .order("name");


        if (result.error) {

            console.error(result.error);

            message(
                "Could not load categories: " +
                result.error.message,
                "error"
            );

            return;
        }


        select.innerHTML =
            '<option value="">Select category</option>';


        result.data.forEach(category => {

            const option =
                document.createElement("option");

            option.value = category.id;
            option.textContent = category.name;

            select.appendChild(option);

        });

    }


    /* ==============================
       LOAD AUTHORS
    ============================== */

    async function loadAuthors() {

        const select =
            document.getElementById("author");


        const result =
            await supabaseClient
                .from("authors")
                .select("id,name")
                .order("name");


        if (result.error) {

            console.error(result.error);

            return;
        }


        select.innerHTML =
            '<option value="">No author</option>';


        result.data.forEach(author => {

            const option =
                document.createElement("option");

            option.value = author.id;
            option.textContent = author.name;

            select.appendChild(option);

        });

    }


    /* ==============================
       CREATE SLUG
    ============================== */

    document
        .getElementById("title")
        .addEventListener("input", function () {

            if (editingId) return;

            const slug =
                this.value
                    .toLowerCase()
                    .trim()
                    .replace(/[^a-z0-9\s-]/g, "")
                    .replace(/\s+/g, "-")
                    .replace(/-+/g, "-");

            document.getElementById("slug")
                .value = slug;

        });


    /* ==============================
       SAVE ARTICLE
    ============================== */

    async function saveArticle(status) {

        const title =
            document.getElementById("title")
                .value.trim();

        const slug =
            document.getElementById("slug")
                .value.trim();

        const excerpt =
            document.getElementById("excerpt")
                .value.trim();

        const content =
            document.getElementById("content")
                .value.trim();

        const image =
            document.getElementById("featuredImage")
                .value.trim();

        const category =
            document.getElementById("category")
                .value || null;

        const author =
            document.getElementById("author")
                .value || null;


        if (!title || !slug || !content) {

            message(
                "Title, slug and article content are required.",
                "error"
            );

            return;
        }


        const articleData = {

            title: title,

            slug: slug,

            excerpt:
                excerpt || null,

            content: content,

            featured_image:
                image || null,

            category_id:
                category,

            author_id:
                author,

            status:
                status,

            published_at:
                status === "published"
                    ? new Date().toISOString()
                    : null

        };


        document.getElementById("saveDraft")
            .disabled = true;

        document.getElementById("publish")
            .disabled = true;


        message(
            status === "published"
                ? "Publishing..."
                : "Saving draft...",
            "info"
        );


        let result;


        if (editingId) {

            result =
                await supabaseClient
                    .from("articles")
                    .update(articleData)
                    .eq("id", editingId)
                    .select()
                    .single();

        } else {

            result =
                await supabaseClient
                    .from("articles")
                    .insert(articleData)
                    .select()
                    .single();

        }


        if (result.error) {

            console.error(result.error);

            document.getElementById("saveDraft")
                .disabled = false;

            document.getElementById("publish")
                .disabled = false;

            message(
                result.error.message,
                "error"
            );

            return;
        }


        message(
            status === "published"
                ? "Article published successfully!"
                : "Draft saved successfully!",
            "success"
        );


        setTimeout(() => {

            location.href = "articles.html";

        }, 1000);

    }


    /* ==============================
       EDIT ARTICLE
    ============================== */

    async function loadArticle() {

        const params =
            new URLSearchParams(
                location.search
            );

        editingId =
            params.get("id");


        if (!editingId) return;


        document.getElementById("pageTitle")
            .textContent = "Edit Article";


        const result =
            await supabaseClient
                .from("articles")
                .select("*")
                .eq("id", editingId)
                .single();


        if (result.error) {

            message(
                "Could not load article: " +
                result.error.message,
                "error"
            );

            return;
        }


        const article = result.data;


        document.getElementById("title")
            .value = article.title || "";

        document.getElementById("slug")
            .value = article.slug || "";

        document.getElementById("excerpt")
            .value = article.excerpt || "";

        document.getElementById("content")
            .value = article.content || "";

        document.getElementById("featuredImage")
            .value = article.featured_image || "";

        document.getElementById("category")
            .value = article.category_id || "";

        document.getElementById("author")
            .value = article.author_id || "";

    }


    /* ==============================
       BUTTONS
    ============================== */

    document
        .getElementById("saveDraft")
        .addEventListener("click", () => {

            saveArticle("draft");

        });


    document
        .getElementById("publish")
        .addEventListener("click", () => {

            saveArticle("published");

        });


    /* ==============================
       LOGOUT
    ============================== */

    document
        .getElementById("logout")
        .addEventListener("click", async () => {

            await supabaseClient.auth.signOut();

            location.href = "index.html";

        });


    /* ==============================
       START
    ============================== */

    async function start() {

        const allowed =
            await checkAdmin();

        if (!allowed) return;

        await loadCategories();

        await loadAuthors();

        await loadArticle();

    }


    start();

</script>

</body>
</html>
