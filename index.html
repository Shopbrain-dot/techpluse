<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechPulse — The Pulse of Technology</title>

    <meta name="description"
        content="TechPulse delivers the latest news in AI, technology, gadgets, startups, cybersecurity, gaming and more.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --dark: #0b1220;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        body.no-scroll {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font-family: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header {
            max-width: 1250px;
            margin: auto;
            min-height: 72px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
            white-space: nowrap;
        }

        .logo span {
            color: var(--primary);
        }

        nav {
            display: flex;
            gap: 20px;
            align-items: center;
            flex: 1;
            justify-content: center;
        }

        nav a {
            font-size: 14px;
            font-weight: 700;
            color: #374151;
        }

        nav a:hover {
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-button {
            border: 0;
            background: #eef2ff;
            color: var(--primary);
            padding: 9px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .menu-button {
            display: none;
            border: 0;
            background: transparent;
            font-size: 25px;
            cursor: pointer;
        }

        /* =========================
           MOBILE MENU
        ========================= */

        .mobile-menu {
            display: none;
            background: white;
            border-top: 1px solid var(--border);
            padding: 15px 20px 20px;
        }

            display: block;
